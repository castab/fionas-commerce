# Railway config as code: https://docs.railway.com/config-as-code
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Migrations run before the server starts, then /ready reports 200 once the database is
# reachable; a new deployment takes traffic only after it passes. /health is liveness only.
healthcheckPath = "/ready"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
