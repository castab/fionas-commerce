# The application version (see build.gradle.kts): a development default until releases
# set their own with -Pversion=<version>.
version=0.0.0-SNAPSHOT

kotlin.code.style=official
org.gradle.configuration-cache=true
org.gradle.caching=true

# Java 25 is a hard requirement. Never auto-download a substitute toolchain;
# fail clearly when no local Java 25 installation is available.
org.gradle.java.installations.auto-download=false
