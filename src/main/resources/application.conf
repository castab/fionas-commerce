# fionas-commerce deployment configuration, read by commerce-runtime's
# CommerceRuntimeConfiguration.load() and then overridden by the environment:
#
#   PORT                            server.port
#   DATABASE_JDBC_URL               database.jdbcUrl          (required)
#   DATABASE_USERNAME               database.username         (required)
#   DATABASE_PASSWORD               database.password         (required, secret)
#   DATABASE_MAXIMUM_POOL_SIZE      database.maximumPoolSize
#   DATABASE_MINIMUM_IDLE           database.minimumIdle
#   DATABASE_CONNECTION_TIMEOUT_MS  database.connectionTimeoutMs
#   DATABASE_VALIDATION_TIMEOUT_MS  database.validationTimeoutMs
#   MIGRATIONS_ON_STARTUP           migrations.onStartup      (migrate or validate)
#   SERVICE_TOKENS_SIGNING_KEY      serviceTokens.signingKey  (required, secret)
#   SERVICE_TOKENS_ISSUER           serviceTokens.issuer      (required)
#   SERVICE_TOKENS_LIFETIME_MINUTES serviceTokens.lifetimeMinutes (runtime default 15, at most 60)
#
# Connection values and the service token settings are empty placeholders: they come only
# from the environment, and secrets are never committed. Everything omitted takes
# commerce-runtime's defaults.

server {
  port = 8080
}

database {
  jdbcUrl = ""
  username = ""
  password = ""
}

# Fiona's deployment runs migrate-then-serve: composing commerce-runtime applies the
# runtime's migrations, then Fiona's, before anything is served. A deployment that migrates
# in a separate release step sets MIGRATIONS_ON_STARTUP=validate instead, so instances only
# check that both migration streams are current.
migrations {
  onStartup = MIGRATE
}

# Service access tokens, which fionas-commerce issues at POST /auth/service/token and accepts
# as `Authorization: Bearer` from SERVICE principals (for example the server-side web
# frontend). Declaring the block makes them required: startup fails until the environment
# supplies both values, and there is no generated fallback.
#
# The signing key is the base64 of at least 32 random bytes (`openssl rand -base64 32`). It
# belongs only to fionas-commerce, signs the access tokens, is shared by every instance of one
# deployment, and is never handed to a frontend or any other service. It is not a service
# credential: a service authenticates with its serviceId and a credential secret created
# through /admin/access/services/{serviceId}/credentials, and exchanges them for a token.
#
# The issuer names this deployment, distinct in every environment: fionas-commerce-local,
# fionas-commerce-staging, fionas-commerce-production.
serviceTokens {
  signingKey = ""
  issuer = ""
}
