# fionas-commerce deployment configuration, read by commerce-runtime's
# CommerceRuntimeConfiguration.load() and then overridden by the environment:
#
#   PORT                            server.port
#   DATABASE_JDBC_URL               database.jdbcUrl          (required)
#   DATABASE_USERNAME               database.username         (required)
#   DATABASE_PASSWORD               database.password         (required, secret)
#   DATABASE_MAXIMUM_POOL_SIZE      database.maximumPoolSize
#   DATABASE_MINIMUM_IDLE           database.minimumIdle
#   DATABASE_CONNECTION_TIMEOUT_MS  database.connectionTimeoutMs
#   DATABASE_VALIDATION_TIMEOUT_MS  database.validationTimeoutMs
#   FLYWAY_ENABLED                  flyway.enabled            (migrate at startup)
#
# Connection values are empty placeholders: they come only from the environment, and
# credentials are never committed. Everything omitted takes commerce-runtime's defaults.

server {
  port = 8080
}

database {
  jdbcUrl = ""
  username = ""
  password = ""
}
