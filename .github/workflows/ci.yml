name: CI

# This workflow verifies source, once, on the pull request that proposes a change to main.
# - A push to a feature branch does not run it; opening the pull request does, and each
#   further push to the branch re-runs it through the pull_request "synchronize" event, once.
# - A merge into main does not run it again. main is expected to be protected (changes arrive
#   only through pull requests whose required checks passed; see "Releasing" in README.md), so
#   what lands in main has already been verified. (image.yml does build the merged commit's
#   image, but that is artifact production, not verification.)
# - A release (release.yml, on a version tag) promotes such a commit and does not re-verify it.
on:
  pull_request:
    branches:
      - main

# CI reads the repository and, to resolve io.github.castab:commerce-runtime and
# commerce-domain, GitHub Packages. It never publishes: fionas-commerce is an
# application, not a library. The Docker Hub credentials are referenced only by the `image` job
# below, which runs after `build` has finished, so no step that executes the pull request's tests
# can see them.
permissions:
  contents: read
  packages: read

# A newer commit to the same pull request supersedes its in-progress run.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (Java 25)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # GitHub Packages requires a token with read:packages even for public packages.
    # The workflow's GITHUB_TOKEN works once the commerce packages grant this repository
    # read access (package settings -> Manage Actions access). Otherwise add a repository
    # secret PACKAGES_READ_TOKEN holding a token with read:packages; it takes precedence.
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Java 25 is a hard requirement; the Gradle toolchain resolves to this JDK
      # (auto-download is disabled).
      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      # Caches Gradle state and validates the checked-in Gradle Wrapper.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Show Gradle and JVM versions
        run: ./gradlew --version

      - name: Lint (ktlint)
        run: ./gradlew ktlintCheck

      # The database specs run against a real PostgreSQL that Gradle starts through the
      # runner's Docker CLI and removes afterwards; no service container is declared here.
      # --no-build-cache ensures the tests actually execute.
      - name: Tests
        run: ./gradlew test --no-build-cache

      # Everything else in `build`, including the executable jar
      # (build/libs/fionas-commerce-all.jar) and the OpenAPI document (generateOpenApi).
      # Tests that already ran above are up to date.
      - name: Full build
        run: ./gradlew build --no-build-cache

      # The Fiona API's OpenAPI document, rendered from the same contract the application
      # serves at /openapi.json, for reviewing the pull request's contract. Retained only when
      # the build succeeded. It is ephemeral CI output at the development version; the permanent,
      # versioned contract is the GitHub Release asset that release.yml publishes.
      - name: Upload OpenAPI document
        uses: actions/upload-artifact@v7
        with:
          name: fionas-commerce-openapi
          path: build/openapi/fionas-commerce-openapi.json
          if-no-files-found: error

      # Dry run of the release's OpenAPI step: the same script release.yml runs, with a
      # throwaway version, writing to the runner's temp directory and publishing nothing. It
      # regenerates the document with an APP_VERSION override, checks that info.version carries it,
      # and produces the versioned file and checksum, so a failure of the release path appears
      # here, on the pull request, before a tag exists. Placed after the upload above because it
      # replaces build/openapi/fionas-commerce-openapi.json with the throwaway-version document.
      - name: Dry run the OpenAPI release assets
        run: bash scripts/package-openapi.sh 0.0.0-dry-run "$RUNNER_TEMP/openapi-dry-run"

  # Builds the pull request's image and, for a pull request from this repository, publishes it as
  # <image>:sha-<head commit>, so the change can be pulled and tried before it merges. Runs only
  # after `build` passed, and in its own job: the Docker Hub secrets are read here and nowhere near
  # the steps that run the tests. A pull request from a fork (or Dependabot) gets no secrets, so it
  # builds and checks the image without pushing it, and so does any run while DOCKERHUB_IMAGE is
  # unset. The image is built from the pull request's head commit, which is what its tag names;
  # `build` verified the merge of that commit into main.
  image:
    name: Build and publish image
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the pull request's head commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Build the image, and publish it when this run may
        uses: ./.github/actions/build-image
        with:
          sha: ${{ github.event.pull_request.head.sha }}
          push: ${{ vars.DOCKERHUB_IMAGE != '' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
          image: ${{ vars.DOCKERHUB_IMAGE }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          package-actor: ${{ github.actor }}
          package-token: ${{ secrets.PACKAGES_READ_TOKEN || secrets.GITHUB_TOKEN }}
